--- 
- 
#  hosts: jeff_pis
  hosts: all
  become: true
  become_method: sudo
  become_user: root
  tasks:


    - name: Get the original (pre-escalation) user's home dir
      ansible.builtin.command: echo $HOME
      register: original_home
      become: false
      changed_when: false
    
    - debug:
        msg: "Original home is {{ original_home.stdout }}"

#    - name: Install Git 
#      apt:
#        name: git
#        state: present

    - name: Install Samba
      apt:
        name: samba
        state: present

    - name: Update smb.conf
      blockinfile:
        dest: "/etc/samba/smb.conf"
        block: |
         [pi]
         path = /home/pi
         only guest = no
         browsable = yes
         writeable = yes
         create mask = 0777
         directory mask = 0777
         public = yes

    - name: Set GPU Memory
      lineinfile:
        path: /boot/config.txt
        regexp: '^gpu_mem='
        line: 'gpu_mem=256'


    - name: Install pip 3
      apt: 
         name: python3-pip
         state: present

